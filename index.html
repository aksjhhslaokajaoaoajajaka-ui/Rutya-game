<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Зомби</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
let p,zs,bs,score,t,over,joy={on:false,id:null,sx:0,sy:0,dx:0,dy:0};
function init(){p={x:0,y:0,hp:100,cd:0,a:0};zs=[];bs=[];score=0;t=0;over=false}
init();

c.addEventListener('pointerdown',e=>{
  if(over){if(t>60)init();return}
  if(!joy.on){joy={on:true,id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0}}
});
c.addEventListener('pointermove',e=>{
  if(joy.on&&e.pointerId===joy.id){
    let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,d=Math.hypot(dx,dy),m=60;
    if(d>m){dx=dx/d*m;dy=dy/d*m}
    joy.dx=dx/m;joy.dy=dy/m;
  }
});
const up=e=>{if(e.pointerId===joy.id)joy={on:false,id:null,sx:0,sy:0,dx:0,dy:0}};
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

function update(){
  t++;
  if(over)return;
  // движение игрока
  p.x+=joy.dx*3.2;p.y+=joy.dy*3.2;
  // появление зомби
  if(t%Math.max(15,60-Math.floor(t/90))===0){
    const a=Math.random()*6.283,r=Math.max(W,H)/2+60;
    zs.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,hp:2,s:0.8+Math.random()*0.5+t/6000});
  }
  // зомби идут к игроку
  for(const z of zs){
    const a=Math.atan2(p.y-z.y,p.x-z.x);
    z.x+=Math.cos(a)*z.s;z.y+=Math.sin(a)*z.s;
    if(Math.hypot(p.x-z.x,p.y-z.y)<24)p.hp-=0.4;
  }
  // авто-стрельба по ближайшему зомби
  p.cd--;
  let n=null,nd=380;
  for(const z of zs){const d=Math.hypot(z.x-p.x,z.y-p.y);if(d<nd){nd=d;n=z}}
  if(n){
    p.a=Math.atan2(n.y-p.y,n.x-p.x);
    if(p.cd<=0){p.cd=14;bs.push({x:p.x,y:p.y,vx:Math.cos(p.a)*9,vy:Math.sin(p.a)*9,l:50})}
  }
  // пули
  for(const b of bs){
    b.x+=b.vx;b.y+=b.vy;b.l--;
    for(const z of zs){
      if(z.hp>0&&Math.hypot(b.x-z.x,b.y-z.y)<16){z.hp--;b.l=0;if(z.hp<=0)score++;break}
    }
  }
  bs=bs.filter(b=>b.l>0);
  zs=zs.filter(z=>z.hp>0);
  if(p.hp<=0){over=true;t=0}
}

function draw(){
  x.fillStyle='#2a3a2a';x.fillRect(0,0,W,H);
  const ox=W/2-p.x,oy=H/2-p.y;
  // сетка земли
  x.strokeStyle='#334533';x.lineWidth=1;x.beginPath();
  for(let gx=(ox%80);gx<W;gx+=80){x.moveTo(gx,0);x.lineTo(gx,H)}
  for(let gy=(oy%80);gy<H;gy+=80){x.moveTo(0,gy);x.lineTo(W,gy)}
  x.stroke();
  // зомби
  for(const z of zs){
    x.fillStyle='#6a9a3a';x.beginPath();x.arc(z.x+ox,z.y+oy,14,0,6.283);x.fill();
    x.fillStyle='#c33';x.fillRect(z.x+ox-8,z.y+oy-6,4,4);x.fillRect(z.x+ox+4,z.y+oy-6,4,4);
  }
  // пули
  x.fillStyle='#ff0';
  for(const b of bs){x.beginPath();x.arc(b.x+ox,b.y+oy,3,0,6.283);x.fill()}
  // игрок
  x.save();x.translate(W/2,H/2);x.rotate(p.a);
  x.fillStyle='#555';x.fillRect(8,-3,20,6);
  x.fillStyle='#3a8be0';x.beginPath();x.arc(0,0,14,0,6.283);x.fill();
  x.restore();
  // джойстик
  if(joy.on){
    x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=3;
    x.beginPath();x.arc(joy.sx,joy.sy,60,0,6.283);x.stroke();
    x.fillStyle='rgba(255,255,255,.4)';
    x.beginPath();x.arc(joy.sx+joy.dx*60,joy.sy+joy.dy*60,24,0,6.283);x.fill();
  }
  // интерфейс
  x.fillStyle='#000a';x.fillRect(12,12,160,16);
  x.fillStyle='#d33';x.fillRect(12,12,160*Math.max(0,p.hp)/100,16);
  x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='left';
  x.fillText('Убито: '+score,12,52);
  if(!joy.on&&!over&&t<300){x.textAlign='center';x.fillText('Води пальцем по экрану — персонаж идёт и стреляет сам',W/2,H-40)}
  if(over){
    x.fillStyle='#000b';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.textAlign='center';
    x.font='bold 36px sans-serif';x.fillText('Тебя съели!',W/2,H/2-20);
    x.font='22px sans-serif';x.fillText('Убито зомби: '+score,W/2,H/2+16);
    x.fillText('Нажми, чтобы начать заново',W/2,H/2+52);
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script></body></html>
