<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Выживалка 3D</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block}
.b{position:fixed;border:0;border-radius:50%;color:#fff;font-weight:bold;opacity:.85}
#atk{right:20px;bottom:30px;width:96px;height:96px;background:#c33;font-size:18px}
#bag{right:14px;top:12px;width:58px;height:58px;background:#357;font-size:12px}
#hud{position:fixed;left:10px;top:10px;color:#fff;font-size:13px;text-shadow:0 0 3px #000;pointer-events:none}
.bar{width:170px;height:12px;background:#000a;margin:3px 0}.bar i{display:block;height:100%}
#toast{position:fixed;left:0;right:0;top:38%;text-align:center;color:#ff0;font-weight:bold;font-size:20px;text-shadow:0 0 4px #000;pointer-events:none}
#menu{position:fixed;inset:0;background:#000d;color:#fff;overflow:auto;padding:14px;display:none}
#menu h3{margin:12px 0 6px}
#menu button{display:block;width:100%;margin:6px 0;padding:10px;font-size:15px;border-radius:8px;border:0;background:#2d6;color:#000;text-align:left}
#menu button:disabled{background:#444;color:#999}
#menu #cl{position:sticky;bottom:0;background:#c33;color:#fff;text-align:center}
</style></head><body>
<div id="hud"></div><div id="toast"></div>
<button class="b" id="atk">УДАР</button><button class="b" id="bag">Сумка</button>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="color:#fff;padding:20px">Не загрузился 3D-движок. Проверь интернет и обнови страницу.</p>'}
else{
const M=document.getElementById('menu'),HUD=document.getElementById('hud'),TO=document.getElementById('toast');
const WS=400,C=200,RES={wood:'Дерево',stone:'Камень',iron:'Железо',leather:'Кожа'};
const NAMES=['Слизень','Крыса','Волк','Гоблин','Тролль','Огр','Дракон','Демон'];
const REC=[
 {n:'Деревянный меч (+4 урон)',c:{wood:5},k:'sword',v:4},
 {n:'Каменный меч (+8 урон)',c:{wood:5,stone:8},k:'sword',v:8},
 {n:'Железный меч (+14 урон)',c:{wood:6,iron:10},k:'sword',v:14},
 {n:'Кожаная броня (-2 урона)',c:{leather:6,wood:4},k:'armor',v:2},
 {n:'Железная броня (-5 урона)',c:{iron:10,leather:6},k:'armor',v:5},
 {n:'Каменная кирка (+1 добыча, можно копать железо)',c:{wood:8,stone:6},k:'tool',v:1},
 {n:'Железная кирка (+2 добыча)',c:{wood:8,iron:8},k:'tool',v:2}
];
let P=null;try{P=JSON.parse(localStorage.getItem('surv3'))}catch(e){}
if(!P||!P.inv)P={x:C,z:C,hp:100,lv:1,xp:0,sword:0,armor:0,tool:0,inv:{wood:0,stone:0,iron:0,leather:0}};
P.cd=0;P.at=0;
const MX=()=>100+P.lv*20,DMG=()=>5+P.lv*2+P.sword;
const save=()=>{try{localStorage.setItem('surv3',JSON.stringify(P))}catch(e){}};setInterval(save,5000);
const R=(a,b)=>a+Math.random()*(b-a);
let tt;function toast(s){TO.textContent=s;clearTimeout(tt);tt=setTimeout(()=>TO.textContent='',1200)}

// сцена
const sc=new THREE.Scene();sc.background=new THREE.Color(0x8fc4e8);sc.fog=new THREE.Fog(0x8fc4e8,25,85);
const cam=new THREE.PerspectiveCamera(60,1,0.1,200);
const ren=new THREE.WebGLRenderer({antialias:false});ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}rs();addEventListener('resize',rs);
sc.add(new THREE.HemisphereLight(0xffffff,0x446644,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.55);sun.position.set(50,100,30);sc.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(WS,WS),new THREE.MeshLambertMaterial({color:0x3d6b34}));
gr.rotation.x=-Math.PI/2;gr.position.set(C,0,C);sc.add(gr);
for(let k=1;k<=8;k++){const r=new THREE.Mesh(new THREE.RingGeometry(k*26-0.15,k*26+0.15,64),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.25,side:2}));
 r.rotation.x=-Math.PI/2;r.position.set(C,0.05,C);sc.add(r)}

// модели
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
function limb(w,h,d,col,x,y){const g=new THREE.Group(),m=box(w,h,d,col);m.position.y=-h/2;g.add(m);g.position.set(x,y,0);return g}
function human(skin,cloth,pants,s,horns){
  const g=new THREE.Group(),b=new THREE.Group();
  const t=box(0.8,1,0.4,cloth);t.position.y=1.6;b.add(t);
  const h=box(0.5,0.5,0.5,skin);h.position.y=2.35;b.add(h);
  const ey=box(0.1,0.1,0.05,0xcc0000);ey.position.set(-0.12,2.4,0.26);b.add(ey);const ey2=ey.clone();ey2.position.x=0.12;b.add(ey2);
  const ll=limb(0.3,1.1,0.3,pants,-0.2,1.1),rl=limb(0.3,1.1,0.3,pants,0.2,1.1);
  const la=limb(0.25,0.9,0.25,skin,-0.55,2.0),ra=limb(0.25,0.9,0.25,skin,0.55,2.0);
  b.add(ll,rl,la,ra);
  if(horns){for(const sx of[-1,1]){const hn=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.4,5),mat(0xeeeecc));hn.position.set(sx*0.2,2.8,0);b.add(hn)}}
  g.add(b);g.scale.setScalar(s);g.userData={ll,rl,la,ra};return g;
}
const player=human(0xf1c9a0,0x2a6fd6,0x333a4a,1,false);sc.add(player);
const swordM=box(0.1,1.3,0.1,0xcccccc);swordM.position.set(0,-1,0.3);swordM.visible=false;player.userData.ra.add(swordM);
function swordLook(){swordM.visible=P.sword>0;swordM.material.color.set(P.sword>=14?0xaaccff:P.sword>=8?0x999999:0x9a6a2a)}swordLook();
function label(t){const cv=document.createElement('canvas');cv.width=256;cv.height=48;const q=cv.getContext('2d');
 q.font='bold 28px sans-serif';q.textAlign='center';q.lineWidth=5;q.strokeStyle='#000';q.strokeText(t,128,34);q.fillStyle='#fff';q.fillText(t,128,34);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));s.scale.set(5,0.94,1);return s}

// ресурсы
const trunkG=new THREE.CylinderGeometry(0.3,0.4,2.5,6),crownG=new THREE.ConeGeometry(1.6,4,7),rockG=new THREE.DodecahedronGeometry(1.2);
const mTr=mat(0x6b4423),mCr=mat(0x1f7a2a),mSt=new THREE.MeshLambertMaterial({color:0x888888,flatShading:true}),mIr=new THREE.MeshLambertMaterial({color:0x5577aa,flatShading:true,emissive:0x112244});
let nodes=[];
function place(t,n,minD){for(let i=0;i<n;i++){let X,Z;do{X=R(5,WS-5);Z=R(5,WS-5)}while(Math.hypot(X-C,Z-C)<minD);
 const g=new THREE.Group(),s=R(0.8,1.3);
 if(t==='wood'){const a=new THREE.Mesh(trunkG,mTr);a.position.y=1.25;const b=new THREE.Mesh(crownG,mCr);b.position.y=4.3;g.add(a,b)}
 else{const a=new THREE.Mesh(rockG,t==='stone'?mSt:mIr);a.position.y=0.8;a.scale.set(1,0.8,1);g.add(a)}
 g.scale.setScalar(s);g.position.set(X,0,Z);g.rotation.y=R(0,6);sc.add(g);nodes.push({x:X,z:Z,t,hp:4,rt:0,g})}}
place('wood',260,10);place('stone',130,14);place('iron',70,50);

// монстры
let ms=[];
function spawnM(){let X,Z,d;do{X=R(5,WS-5);Z=R(5,WS-5);d=Math.hypot(X-C,Z-C)}while(d<26);
 const lv=Math.min(8,1+Math.floor(d/26)),s=0.8+lv*0.15;
 const col=new THREE.Color().setHSL((130-lv*16)/360,0.55,0.4);
 const g=human(col,col.clone().multiplyScalar(0.7),0x222222,s,lv>=3);g.position.set(X,0,Z);sc.add(g);
 const lb=label(NAMES[lv-1]+' ур.'+lv);lb.position.y=3.4*s;g.add(lb);
 const bar=new THREE.Sprite(new THREE.SpriteMaterial({color:0xee3333,depthTest:false}));bar.scale.set(2,0.2,1);bar.position.y=3.0*s;g.add(bar);
 ms.push({g,bar,x:X,z:Z,hx:X,z0:Z,tx:X,tz:Z,lv,hp:20+lv*18,mh:20+lv*18,dm:3+lv*2,sp:(0.8+lv*0.07)/10,s,cd:0,ph:R(0,6)})}
for(let i=0;i<50;i++)spawnM();

// управление
let atk=false,joy={on:false,id:null,sx:0,sy:0,dx:0,dy:0};
const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{if(!joy.on)joy={on:true,id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0}});
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,d=Math.hypot(dx,dy),m=60;if(d>m){dx=dx/d*m;dy=dy/d*m}joy.dx=dx/m;joy.dy=dy/m}});
const up=e=>{if(e.pointerId===joy.id)joy={on:false,id:null,sx:0,sy:0,dx:0,dy:0}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const A=document.getElementById('atk');
A.addEventListener('pointerdown',e=>{atk=true;e.preventDefault()});
['pointerup','pointercancel','pointerleave'].forEach(n=>A.addEventListener(n,()=>atk=false));
document.getElementById('bag').onclick=()=>{menu();M.style.display='block';atk=false};
addEventListener('contextmenu',e=>e.preventDefault());

function menu(){
 let h='<h2>Сумка</h2><div>Уровень '+P.lv+' · урон '+DMG()+' · броня '+P.armor+'</div><h3>Ресурсы</h3>';
 for(const k in RES)h+='<div>'+RES[k]+': '+P.inv[k]+'</div>';
 h+='<h3>Крафт</h3>';
 REC.forEach((r,i)=>{const have=P[r.k]>=r.v;let ok=!have,cs=[];
  for(const k in r.c){cs.push(RES[k]+' '+r.c[k]);if(P.inv[k]<r.c[k])ok=false}
  h+='<button '+(ok?'':'disabled')+' onclick="craft('+i+')">'+r.n+(have?' ✔':'')+'<br><small>'+cs.join(', ')+'</small></button>'});
 h+='<button id="cl" onclick="M.style.display=\'none\'">Закрыть</button>';M.innerHTML=h}
window.M=M;window.craft=function(i){const r=REC[i];if(P[r.k]>=r.v)return;
 for(const k in r.c)if(P.inv[k]<r.c[k])return;
 for(const k in r.c)P.inv[k]-=r.c[k];P[r.k]=r.v;swordLook();save();menu()};

function hit(){
 P.cd=22;P.at=1;
 let m=null,md=7.5;
 for(const z of ms){const d=Math.hypot(z.x-P.x,z.z-P.z)-z.s;if(d<md){md=d;m=z}}
 if(m){const d=DMG();m.hp-=d;
  if(m.hp<=0){P.xp+=12*m.lv;let t='+'+12*m.lv+' опыт';
   if(Math.random()<0.7){const n=1+Math.floor(Math.random()*m.lv);P.inv.leather+=n;t+=', +'+n+' кожа'}
   toast(t);sc.remove(m.g);ms.splice(ms.indexOf(m),1);
   while(P.xp>=P.lv*40){P.xp-=P.lv*40;P.lv++;P.hp=MX();toast('Новый уровень: '+P.lv+'!')}}
  return}
 let n=null,nd=7;
 for(const o of nodes){if(o.rt>0)continue;const d=Math.hypot(o.x-P.x,o.z-P.z);if(d<nd){nd=d;n=o}}
 if(n){if(n.t==='iron'&&P.tool<1){toast('Нужна кирка');return}
  const g=1+P.tool;P.inv[n.t]+=g;n.hp--;toast('+'+g+' '+RES[n.t]);
  if(n.hp<=0){n.rt=1500;n.hp=4;n.g.visible=false}}
}

let tick=0;
function update(){
 tick++;
 const mv=Math.hypot(joy.dx,joy.dy);
 P.x=Math.max(2,Math.min(WS-2,P.x+joy.dx*0.32));P.z=Math.max(2,Math.min(WS-2,P.z+joy.dy*0.32));
 if(mv>0.1)player.rotation.y=Math.atan2(joy.dx,joy.dy);
 if(P.hp<MX())P.hp=Math.min(MX(),P.hp+0.03);
 P.cd--;if(atk&&P.cd<=0)hit();
 for(const o of nodes)if(o.rt>0){o.rt--;if(o.rt===0)o.g.visible=true}
 for(const z of ms){
  z.cd--;const d=Math.hypot(P.x-z.x,P.z-z.z);let moving=false;
  if(d<20){const a=Math.atan2(P.x-z.x,P.z-z.z);z.g.rotation.y=a;
   if(d>z.s+1.2){z.x+=Math.sin(a)*z.sp;z.z+=Math.cos(a)*z.sp;moving=true}
   else if(z.cd<=0){const dm=Math.max(1,z.dm-P.armor);P.hp-=dm;z.cd=50;z.at=1}}
  else{if(Math.random()<0.01){z.tx=z.hx+R(-8,8);z.tz=z.z0+R(-8,8)}
   if(Math.hypot(z.tx-z.x,z.tz-z.z)>0.4){const a=Math.atan2(z.tx-z.x,z.tz-z.z);z.x+=Math.sin(a)*0.05;z.z+=Math.cos(a)*0.05;z.g.rotation.y=a;moving=true}}
  z.g.position.set(z.x,0,z.z);
  const u=z.g.userData;z.ph+=moving?0.2:0;
  u.ll.rotation.x=Math.sin(z.ph)*0.7;u.rl.rotation.x=-Math.sin(z.ph)*0.7;
  z.at=Math.max(0,(z.at||0)-0.06);u.ra.rotation.x=-Math.sin(z.at*Math.PI)*2;u.la.rotation.x=Math.sin(z.ph)*0.5;
  z.bar.scale.x=Math.max(0.01,2*z.hp/z.mh);
 }
 if(tick%300===0&&ms.length<50)spawnM();
 if(P.hp<=0){P.x=C;P.z=C;P.hp=MX();for(const k in P.inv)P.inv[k]=Math.floor(P.inv[k]/2);toast('Ты погиб! Потеряна половина ресурсов')}
 // анимация игрока
 const u=player.userData;P.ph=(P.ph||0)+mv*0.35;
 u.ll.rotation.x=Math.sin(P.ph)*0.8;u.rl.rotation.x=-Math.sin(P.ph)*0.8;u.la.rotation.x=Math.sin(P.ph)*0.6;
 P.at=Math.max(0,P.at-0.07);u.ra.rotation.x=P.at>0?-Math.sin(P.at*Math.PI)*2:-Math.sin(P.ph)*0.6;
 player.position.set(P.x,0,P.z);
 cam.position.set(P.x,15,P.z+12);cam.lookAt(P.x,1,P.z);
 if(tick%8===0)HUD.innerHTML='<b>Ур.'+P.lv+'</b> HP '+Math.ceil(P.hp)+'/'+MX()+'<div class="bar"><i style="width:'+Math.max(0,100*P.hp/MX())+'%;background:#d33"></i></div><div class="bar" style="height:7px"><i style="width:'+100*P.xp/(P.lv*40)+'%;background:#4af"></i></div>Дерево '+P.inv.wood+' · Камень '+P.inv.stone+' · Железо '+P.inv.iron+' · Кожа '+P.inv.leather;
}
(function loop(){if(M.style.display!=='block')update();ren.render(sc,cam);requestAnimationFrame(loop)})();
toast('Води пальцем — идёшь. УДАР бьёт и добывает');
}
</script></body></html>
