<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Выживалка 3D</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block}
.b{position:fixed;border:0;border-radius:50%;color:#fff;font-weight:bold;opacity:.85}
#atk{right:20px;bottom:30px;width:98px;height:98px;background:#c33;font-size:18px}
#dg{right:132px;bottom:34px;width:68px;height:68px;background:#27a;font-size:12px}
#bag{right:14px;top:12px;width:58px;height:58px;background:#357;font-size:12px}
#hud{position:fixed;left:10px;top:10px;color:#fff;font-size:13px;text-shadow:0 0 3px #000;pointer-events:none}
.bar{width:170px;height:12px;background:#000a;margin:3px 0}.bar i{display:block;height:100%}
#toast{position:fixed;left:0;right:0;top:30%;text-align:center;color:#ff0;font-weight:bold;font-size:20px;text-shadow:0 0 4px #000;pointer-events:none}
#fl{position:fixed;inset:0;background:radial-gradient(transparent 40%,#f00);opacity:0;transition:opacity .35s;pointer-events:none}
.dn{position:fixed;left:0;top:0;font-weight:bold;font-size:19px;text-shadow:0 0 3px #000;pointer-events:none}
#menu{position:fixed;inset:0;background:#000d;color:#fff;overflow:auto;padding:14px;display:none}
#menu h3{margin:12px 0 6px}
#menu button{display:block;width:100%;margin:6px 0;padding:10px;font-size:15px;border-radius:8px;border:0;background:#2d6;color:#000;text-align:left}
#menu button:disabled{background:#444;color:#999}
#menu #cl{position:sticky;bottom:0;background:#c33;color:#fff;text-align:center}
</style></head><body>
<div id="hud"></div><div id="toast"></div><div id="fl"></div>
<button class="b" id="atk">УДАР</button><button class="b" id="dg">ПЕРЕКАТ</button><button class="b" id="bag">Сумка</button>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="color:#fff;padding:20px">Не загрузился 3D-движок. Проверь интернет и обнови страницу.</p>';return}
const M=document.getElementById('menu'),HUD=document.getElementById('hud'),TO=document.getElementById('toast'),FL=document.getElementById('fl');
const WS=400,C=200,PI=Math.PI,RES={wood:'Дерево',stone:'Камень',iron:'Железо',leather:'Кожа'};
const NAMES=['Слизень','Крыса','Волк','Гоблин','Тролль','Огр','Дракон','Демон'];
const REC=[
 {n:'Деревянный меч (+4 урон)',c:{wood:5},k:'sword',v:4},
 {n:'Каменный меч (+8 урон)',c:{wood:5,stone:8},k:'sword',v:8},
 {n:'Железный меч (+14 урон)',c:{wood:6,iron:10},k:'sword',v:14},
 {n:'Кожаная броня (-2 урона)',c:{leather:6,wood:4},k:'armor',v:2},
 {n:'Железная броня (-5 урона)',c:{iron:10,leather:6},k:'armor',v:5},
 {n:'Каменная кирка (+1 добыча, можно копать железо)',c:{wood:8,stone:6},k:'tool',v:1},
 {n:'Железная кирка (+2 добыча)',c:{wood:8,iron:8},k:'tool',v:2}
];
let P=null;try{P=JSON.parse(localStorage.getItem('surv3'))}catch(e){}
if(!P||!P.inv)P={x:C,z:C,hp:100,lv:1,xp:0,sword:0,armor:0,tool:0,inv:{wood:0,stone:0,iron:0,leather:0}};
Object.assign(P,{cd:0,at:0,sw:0,combo:0,ct:0,dd:0,dc:0,ddx:0,ddz:1,vx:0,vz:0,ph:0,iv:false});
const MX=()=>100+P.lv*20,DMG=()=>5+P.lv*2+P.sword;
const save=()=>{try{localStorage.setItem('surv3',JSON.stringify(P))}catch(e){}};setInterval(save,5000);
const R=(a,b)=>a+Math.random()*(b-a);
const ang=(c,t)=>{let d=t-c;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return c+d*0.3};
let tt;function toast(s){TO.textContent=s;clearTimeout(tt);tt=setTimeout(()=>TO.textContent='',1300)}

// ===== сцена =====
const HZ=0xbfd9ee,sc=new THREE.Scene();sc.fog=new THREE.Fog(HZ,35,100);
const cam=new THREE.PerspectiveCamera(62,1,0.1,300);
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
let PR=Math.min(devicePixelRatio,1.5);ren.setPixelRatio(PR);ren.setClearColor(HZ);
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFShadowMap;
document.body.prepend(ren.domElement);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}rs();addEventListener('resize',rs);
// небо и солнце
const sky=new THREE.Mesh(new THREE.SphereGeometry(200,16,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying float h;void main(){gl_FragColor=vec4(mix(vec3(.75,.85,.93),vec3(.2,.48,.88),clamp(h*1.7,0.,1.)),1.);}'}));
sc.add(sky);
const sunM=new THREE.Mesh(new THREE.SphereGeometry(7,12,8),new THREE.MeshBasicMaterial({color:0xfff4c0,fog:false}));sc.add(sunM);
const glow=new THREE.Mesh(new THREE.SphereGeometry(14,12,8),new THREE.MeshBasicMaterial({color:0xfff0a0,transparent:true,opacity:0.25,fog:false,depthWrite:false}));sunM.add(glow);
// свет и тени
sc.add(new THREE.HemisphereLight(0xdcecff,0x4a6a3a,0.75));
const sun=new THREE.DirectionalLight(0xfff0d0,0.95);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const sh=sun.shadow.camera;sh.left=-30;sh.right=30;sh.top=30;sh.bottom=-30;sh.near=1;sh.far=140;sun.shadow.bias=-0.0006;sc.add(sun,sun.target);
// земля
const gg=new THREE.PlaneGeometry(WS,WS,60,60);gg.rotateX(-PI/2);
const gc=[];for(let i=0;i<gg.attributes.position.count;i++){const v=R(0.85,1.12);gc.push(0.24*v,0.5*v,0.2*v)}
gg.setAttribute('color',new THREE.Float32BufferAttribute(gc,3));
const gr=new THREE.Mesh(gg,new THREE.MeshLambertMaterial({vertexColors:true}));gr.position.set(C,0,C);gr.receiveShadow=true;sc.add(gr);
for(let k=1;k<=8;k++){const r=new THREE.Mesh(new THREE.RingGeometry(k*26-0.12,k*26+0.12,64),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.22,side:2}));r.rotation.x=-PI/2;r.position.set(C,0.05,C);sc.add(r)}

// ===== пачки (instancing) =====
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_p=new THREE.Vector3(),_s=new THREE.Vector3(),_e=new THREE.Euler(),_c=new THREE.Color();
function inst(geo,col,n,shadow,emis){const mt=new THREE.MeshLambertMaterial({color:col,flatShading:true});if(emis)mt.emissive.set(emis);
 const m=new THREE.InstancedMesh(geo,mt,n);m.castShadow=shadow;m.frustumCulled=false;sc.add(m);return m}
// трава
const grass=inst(new THREE.ConeGeometry(0.1,0.7,3).translate(0,0.35,0),0xffffff,6000,false);
for(let i=0;i<6000;i++){_p.set(R(2,WS-2),0,R(2,WS-2));_q.setFromEuler(_e.set(R(-.2,.2),R(0,6),R(-.2,.2)));_s.setScalar(R(.7,1.7));_m.compose(_p,_q,_s);grass.setMatrixAt(i,_m);grass.setColorAt(i,_c.setHSL(R(.22,.32),.55,R(.25,.42)))}
const fl=inst(new THREE.SphereGeometry(0.13,4,3).translate(0,0.55,0),0xffffff,700,false);
const FC=[0xffe14d,0xffffff,0xff7aa8,0xb07aff];
for(let i=0;i<700;i++){_p.set(R(2,WS-2),0,R(2,WS-2));_q.identity();_s.setScalar(R(.8,1.4));_m.compose(_p,_q,_s);fl.setMatrixAt(i,_m);fl.setColorAt(i,_c.set(FC[i%4]))}
// ресурсы
const NT=260,NS=130,NI=70;
const trees=[inst(new THREE.CylinderGeometry(0.3,0.4,2.5,6).translate(0,1.25,0),0x6b4423,NT,true),
 inst(new THREE.ConeGeometry(1.7,3.2,7).translate(0,3.6,0),0x1f7a2a,NT,true),
 inst(new THREE.ConeGeometry(1.2,2.6,7).translate(0,5.2,0),0x2a9a3a,NT,true)];
const rg=new THREE.DodecahedronGeometry(1.2).scale(1,0.8,1).translate(0,0.8,0);
const stones=[inst(rg,0x8a8a8a,NS,true)],irons=[inst(rg,0x5577aa,NI,true,0x112a55)];
let nodes=[];
function setN(o,v){_p.set(o.x,0,o.z);_q.setFromEuler(_e.set(0,o.r,0));_s.setScalar(v?o.s:0.0001);_m.compose(_p,_q,_s);
 for(const m of o.l){m.setMatrixAt(o.i,_m);m.instanceMatrix.needsUpdate=true}}
function build(t,n,minD,list){for(let i=0;i<n;i++){let X,Z;do{X=R(5,WS-5);Z=R(5,WS-5)}while(Math.hypot(X-C,Z-C)<minD);
 const o={t,x:X,z:Z,i,l:list,s:R(.8,1.3),r:R(0,6),hp:4,rt:0};setN(o,1);nodes.push(o)}}
build('wood',NT,10,trees);build('stone',NS,14,stones);build('iron',NI,50,irons);
// облака
const NC=140,clouds=inst(new THREE.SphereGeometry(1,6,5),0xffffff,NC,false);
clouds.material=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.93,fog:false});
for(let c=0,i=0;c<30;c++){const cx=R(-150,550),cz=R(-100,500),cy=R(48,62);
 for(let k=0;k<4&&i<NC;k++,i++){_p.set(cx+R(-7,7),cy+R(-1,1),cz+R(-4,4));_q.identity();_s.set(R(5,9),R(2,3.5),R(4,6));_m.compose(_p,_q,_s);clouds.setMatrixAt(i,_m)}}
// частицы
const NP=180,pg=new THREE.BufferGeometry(),pp=new Float32Array(NP*3).fill(-999),pc=new Float32Array(NP*3),pv=new Float32Array(NP*3),pl=new Float32Array(NP);
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:0.4,vertexColors:true,depthWrite:false}));pts.frustumCulled=false;sc.add(pts);
let pi=0;
function burst(x,y,z,col,n){_c.set(col);for(let k=0;k<n;k++){const i=pi++%NP;pp[i*3]=x;pp[i*3+1]=y;pp[i*3+2]=z;pv[i*3]=R(-.14,.14);pv[i*3+1]=R(.04,.26);pv[i*3+2]=R(-.14,.14);pc[i*3]=_c.r;pc[i*3+1]=_c.g;pc[i*3+2]=_c.b;pl[i]=R(18,34)}pg.attributes.color.needsUpdate=true}
// цифры урона
let dns=[];
function dn(x,y,z,s,col){if(dns.length>18)return;const el=document.createElement('div');el.className='dn';el.textContent=s;el.style.color=col;document.body.appendChild(el);dns.push({el,p:new THREE.Vector3(x,y,z),l:45})}

// ===== модели =====
const GC={},MC={};
function bx(w,h,d,c){const k=w+'_'+h+'_'+d,g=GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d)),m=MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));const o=new THREE.Mesh(g,m);o.castShadow=true;return o}
function limb(w,h,d,col,x,y){const g=new THREE.Group(),m=bx(w,h,d,col);m.position.y=-h/2;g.add(m);g.position.set(x,y,0);return g}
function human(skin,cloth,pants,s,horns,hair){
 const g=new THREE.Group(),b=new THREE.Group();
 const t=bx(0.8,1,0.4,cloth);t.position.y=1.6;b.add(t);
 const h=bx(0.5,0.5,0.5,skin);h.position.y=2.35;b.add(h);
 const e1=bx(0.1,0.1,0.05,0xcc0000);e1.position.set(-0.12,2.4,0.26);const e2=e1.clone();e2.position.x=0.12;b.add(e1,e2);
 if(hair){const hr=bx(0.54,0.14,0.54,hair);hr.position.y=2.64;b.add(hr)}
 const ll=limb(0.3,1.1,0.3,pants,-0.2,1.1),rl=limb(0.3,1.1,0.3,pants,0.2,1.1);
 const ft=bx(0.32,0.15,0.42,0x222222);ft.position.set(0,-1.05,0.05);ll.add(ft);const ft2=ft.clone();rl.add(ft2);
 const la=limb(0.25,0.9,0.25,skin,-0.55,2.0),ra=limb(0.25,0.9,0.25,skin,0.55,2.0);
 b.add(ll,rl,la,ra);
 if(horns)for(const sx of[-1,1]){const hn=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.45,5),new THREE.MeshLambertMaterial({color:0xeeeecc}));hn.position.set(sx*0.2,2.8,0);b.add(hn)}
 g.add(b);g.scale.setScalar(s);g.userData={ll,rl,la,ra,b};return g}
const player=human(0xf1c9a0,0x2a6fd6,0x333a4a,1,false,0x3a2616);sc.add(player);
const swordM=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.4,0.1),new THREE.MeshLambertMaterial());swordM.position.set(0,-0.9,0.3);swordM.castShadow=true;player.userData.ra.add(swordM);
function swordLook(){swordM.visible=P.sword>0;swordM.material.color.set(P.sword>=14?0xaaccff:P.sword>=8?0x999999:0x9a6a2a)}swordLook();
function label(t){const cv=document.createElement('canvas');cv.width=256;cv.height=48;const q=cv.getContext('2d');
 q.font='bold 28px sans-serif';q.textAlign='center';q.lineWidth=5;q.strokeStyle='#000';q.strokeText(t,128,34);q.fillStyle='#fff';q.fillText(t,128,34);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));s.scale.set(5,0.94,1);return s}

// ===== монстры =====
let ms=[];
function spawnM(){let X,Z,d;do{X=R(5,WS-5);Z=R(5,WS-5);d=Math.hypot(X-C,Z-C)}while(d<26);
 const lv=Math.min(8,1+Math.floor(d/26)),s=0.8+lv*0.15,h=(130-lv*16)/360;
 const g=human(new THREE.Color().setHSL(h,0.55,0.4).getHex(),new THREE.Color().setHSL(h,0.5,0.27).getHex(),0x222222,s,lv>=3,0);
 g.position.set(X,0,Z);sc.add(g);
 const lb=label(NAMES[lv-1]+' ур.'+lv);lb.position.y=3.4*s;g.add(lb);
 const bar=new THREE.Sprite(new THREE.SpriteMaterial({color:0xee3333,depthTest:false}));bar.scale.set(2,0.2,1);bar.position.y=3.0*s;g.add(bar);
 ms.push({g,bar,x:X,z:Z,hx:X,hz:Z,tx:X,tz:Z,lv,hp:20+lv*18,mh:20+lv*18,dm:3+lv*2,sp:(0.8+lv*0.07)/10*1.2,s,cd:0,ph:R(0,6),wt:0,at:0,kx:0,kz:0,stun:0,dead:0})}
for(let i=0;i<40;i++)spawnM();

// ===== управление =====
let atk=false,cy=0,cp=0.62,shake=0;
let joy={on:false,id:null,sx:0,sy:0,dx:0,dy:0},cd={on:false,id:null,lx:0,ly:0};
const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{
 if(e.clientX<innerWidth*0.5){if(!joy.on)joy={on:true,id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0}}
 else if(!cd.on)cd={on:true,id:e.pointerId,lx:e.clientX,ly:e.clientY}});
cv.addEventListener('pointermove',e=>{
 if(joy.on&&e.pointerId===joy.id){let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,d=Math.hypot(dx,dy),m=55;if(d>m){dx=dx/d*m;dy=dy/d*m}joy.dx=dx/m;joy.dy=dy/m}
 if(cd.on&&e.pointerId===cd.id){cy-=(e.clientX-cd.lx)*0.008;cp=Math.max(0.25,Math.min(1.1,cp+(e.clientY-cd.ly)*0.004));cd.lx=e.clientX;cd.ly=e.clientY}});
const up=e=>{if(e.pointerId===joy.id)joy={on:false,id:null,sx:0,sy:0,dx:0,dy:0};if(e.pointerId===cd.id)cd.on=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const A=document.getElementById('atk');
A.addEventListener('pointerdown',e=>{atk=true;e.preventDefault()});
['pointerup','pointercancel','pointerleave'].forEach(n=>A.addEventListener(n,()=>atk=false));
document.getElementById('dg').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});
document.getElementById('bag').onclick=()=>{menu();M.style.display='block';atk=false};
addEventListener('contextmenu',e=>e.preventDefault());
function mvec(){const m=Math.hypot(joy.dx,joy.dy);if(m<0.12)return[0,0,0];const s=Math.sin(cy),c=Math.cos(cy),dx=joy.dx/m,dy=joy.dy/m;return[dx*c+dy*s,-dx*s+dy*c,Math.min(1,m)]}
function dodge(){if(P.dc>0||P.dd>0)return;const v=mvec();let x=v[0],z=v[1];if(v[2]===0){x=Math.sin(player.rotation.y);z=Math.cos(player.rotation.y)}
 P.ddx=x;P.ddz=z;P.dd=16;P.dc=50;player.rotation.y=Math.atan2(x,z)}

function menu(){
 let h='<h2>Сумка</h2><div>Уровень '+P.lv+' · урон '+DMG()+' · броня '+P.armor+'</div><h3>Ресурсы</h3>';
 for(const k in RES)h+='<div>'+RES[k]+': '+P.inv[k]+'</div>';
 h+='<h3>Крафт</h3>';
 REC.forEach((r,i)=>{const have=P[r.k]>=r.v;let ok=!have,cs=[];
  for(const k in r.c){cs.push(RES[k]+' '+r.c[k]);if(P.inv[k]<r.c[k])ok=false}
  h+='<button '+(ok?'':'disabled')+' onclick="craft('+i+')">'+r.n+(have?' ✔':'')+'<br><small>'+cs.join(', ')+'</small></button>'});
 h+='<button id="cl" onclick="M.style.display=\'none\'">Закрыть</button>';M.innerHTML=h}
window.M=M;window.craft=function(i){const r=REC[i];if(P[r.k]>=r.v)return;
 for(const k in r.c)if(P.inv[k]<r.c[k])return;
 for(const k in r.c)P.inv[k]-=r.c[k];P[r.k]=r.v;swordLook();save();menu()};

// ===== бой =====
function hit(){
 const big=P.combo===2;P.cd=big?30:18;P.at=1;P.sw=P.combo;
 let m=null,md=9;
 for(const z of ms){if(z.dead)continue;const d=Math.hypot(z.x-P.x,z.z-P.z)-z.s;if(d<md){md=d;m=z}}
 if(m){
  const a=Math.atan2(m.x-P.x,m.z-P.z);player.rotation.y=a;P.vx=Math.sin(a)*0.3;P.vz=Math.cos(a)*0.3;
  const crit=Math.random()<0.12;let d=Math.round(DMG()*(big?1.7:1)*(crit?1.5:1));
  m.hp-=d;m.kx=Math.sin(a)*(big?0.55:0.22);m.kz=Math.cos(a)*(big?0.55:0.22);m.stun=big?30:12;m.wt=0;
  burst(m.x,1.5*m.s,m.z,crit?0xffee33:0xff3030,big?30:14);burst(P.x+Math.sin(a)*1.5,1.6,P.z+Math.cos(a)*1.5,0xffffff,6);
  dn(m.x,3.2*m.s,m.z,(crit?'КРИТ ':'')+'-'+d,crit?'#ff0':'#fff');shake=big?0.7:0.25;
  if(m.hp<=0){m.dead=1;P.xp+=12*m.lv;let t='+'+12*m.lv+' опыт';
   if(Math.random()<0.7){const n=1+Math.floor(Math.random()*m.lv);P.inv.leather+=n;t+=', +'+n+' кожа'}
   toast(t);
   while(P.xp>=P.lv*40){P.xp-=P.lv*40;P.lv++;P.hp=MX();toast('Новый уровень: '+P.lv+'!')}}
 }else{
  let n=null,nd=7;
  for(const o of nodes){if(o.rt>0)continue;const d=Math.hypot(o.x-P.x,o.z-P.z);if(d<nd){nd=d;n=o}}
  if(n){if(n.t==='iron'&&P.tool<1){toast('Нужна кирка');return}
   const g=1+P.tool;P.inv[n.t]+=g;n.hp--;toast('+'+g+' '+RES[n.t]);
   burst(n.x,1.2,n.z,n.t==='wood'?0x8a5a2a:n.t==='stone'?0xaaaaaa:0x77aaff,10);shake=0.12;
   if(n.hp<=0){n.rt=1500;n.hp=4;setN(n,0)}}
 }
 P.combo=(P.combo+1)%3;P.ct=50;
}

let tick=0;
function update(){
 tick++;
 const v=mvec();
 if(P.dd>0){P.dd--;P.x+=P.ddx*0.9;P.z+=P.ddz*0.9}
 else{const sp=v[2]>0.85?0.5:0.36*v[2];P.x+=v[0]*sp;P.z+=v[1]*sp;if(v[2]>0)player.rotation.y=ang(player.rotation.y,Math.atan2(v[0],v[1]))}
 P.x=Math.max(2,Math.min(WS-2,P.x+P.vx));P.z=Math.max(2,Math.min(WS-2,P.z+P.vz));P.vx*=0.8;P.vz*=0.8;
 P.dc--;P.iv=P.dd>0;P.ct--;if(P.ct<=0)P.combo=0;
 if(P.hp<MX())P.hp=Math.min(MX(),P.hp+0.03);
 P.cd--;if(atk&&P.cd<=0&&P.dd<=0)hit();
